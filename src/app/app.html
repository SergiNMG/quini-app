<div class="min-h-screen bg-slate-950 text-slate-100">
  <header class="border-b border-slate-800 px-6 py-5">
    <div class="mx-auto flex max-w-5xl flex-wrap items-center gap-4">
      <a routerLink="/app" class="text-xl font-bold">Quini</a>
      @if (auth.isAuthenticated()) {
        <nav aria-label="Navegación principal" class="flex gap-4">
          <a routerLink="/app" class="text-emerald-300">Inicio</a>
          @if (auth.isAdmin()) {
            <a routerLink="/admin" class="text-emerald-300">Administración</a>
          }
        </nav>
        <span class="ml-auto text-sm text-slate-300">{{ auth.profile()?.username }}</span>
        <button
          type="button"
          (click)="logout()"
          [disabled]="signingOut()"
          class="rounded border border-slate-600 px-3 py-2 text-sm disabled:opacity-50"
        >
          Cerrar sesión
        </button>
      }
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-6 py-10">
    @if (auth.status() === 'loading') {
      <p role="status" aria-live="polite" class="py-10 text-slate-300">Comprobando sesión…</p>
    }
    <!-- Conservar el outlet durante la carga sin mostrar contenido privado obsoleto. -->
    <div [hidden]="hideContent()">
      <router-outlet />
    </div>
  </main>
</div>
